weights:
  model_path: "models/TuringLLM/model_1722550239_03986.pt" # Path to the TuringLLM model checkpoint
  sae_path: "models/TuringLLM/SAE" # Directory containing SAE weights (sae-attn/, sae-mlp/, sae-resid/)
data:
  dataset_path: "data" # Directory containing tokenized .npy data shards
  n_shards: 4 # Number of data shards to process
  batch_size: 512 # Sequences per batch during inference
hardware:
  multi_gpu: false # true = use all available GPUs, false = single primary GPU
  memory: "efficient" # "efficient" (minimize VRAM, CPU offloading) | "fast" (maximize throughput, pin memory, keep decoders in VRAM)
  compile: true # torch.compile for model + SAEs (recommended for Hopper/Blackwell GPUs)
  parallel_kinds: false # true = dispatch attn/mlp/resid SAE encodes on separate CUDA streams for potential overlap
  ann_device: "auto" # ANN search device for neg_ctx: "auto" (GPU if CUDA available, else CPU) | "gpu" | "cpu"
  keep_model_loaded_for_neg_ctx: false # high-VRAM mode: skip model/SAE offload + reload around neg_ctx
latents:
  top_ctx:
    n_sequences: 64 # Top sequences to store per latent (ranked by mean activation)
  mid_ctx:
    n_sequences: 64 # Reservoir size per latent
    mode: "reservoir_cpu" # "reservoir_cpu" | "gpu_topk_mid"
    band_low_sigma: 0.5 # Lower edge of mid band: mean_seq + band_low_sigma * std_seq
    band_high_sigma: 1.5 # Upper edge of mid band: mean_seq + band_high_sigma * std_seq
    warmup_batches: 100 # Batches per component before mid_ctx updates begin (lets Welford stats stabilise)
  neg_ctx:
    n_sequences: 64 # Negatives to store per latent
    n_neighbors: 512 # ANN query K per latent (oversamples before PosCtx filter)
    min_pos_ctx: 8 # Minimum PosCtx sequences required to attempt neg retrieval
    backend: "single_gpu_exact" # "single_gpu_exact" | "multi_gpu_exact"
    devices: [] # multi_gpu_exact devices; empty = all visible CUDA devices
    repr_mode: "mean_pool" # "mean_pool" (average residual over all token positions) | "last_token"
    max_repr_seqs: 200000 # Max sequences stored in seq_repr (null = store all). Set e.g. 200000 for large datasets to cap memory and ANN cost.
  logit_ctx:
    n_tokens_per_latent: 32 # Number of token prediction entries to track per latent
    topk_output_tokens: 32 # Top predicted tokens to store per latent
  top_coactivation:
    n_latents_per_latent: 64 # Final number of top co-activating latents stored per target latent
    n_candidates_per_component: 16 # Candidates extracted per component per sequence during dump (36 comps x 16 = 576, reduced to 128 globally)
    freq_alpha: 2.0 # Exponent for frequency adjustment: 1/(log(count+1))^alpha. Higher = suppress frequent latents more
    mode: "pmi" # "freq_weighted" (default) | "raw" (no freq adjustment) | "pmi" (token-level PMI scoring)
    pmi_clamp_min: -5.0 # Lower bound for PMI values
    pmi_clamp_max: 10.0 # Upper bound for PMI values
    dump_device: "gpu" # "cpu" = legacy per-batch CPU dump | "gpu" = keep dump on GPU and copy once before reduction
    dump_profile: true # Print aggregate timing breakdown for second-pass dump/update_batch
    reduce_backend: "single_process" # "single_process" | "target_sharded"
    reduce_shards: 1 # Number of target ranges for target_sharded reduction
    reduce_shard_output_dir: null # Optional directory for target_sharded partial reducer files before merge
    reduce_omp_threads: null # null uses OMP_NUM_THREADS / OpenMP default; set an int to override inside reducer
    reduce_schedule_chunk: 256 # OpenMP dynamic schedule chunk size for native reducer targets
  seq_latent_index:
    enabled: true # Write per-shard (seq_id, latent_id) index files to outputs/seq_latent_index/
    top_k_per_component: 12 # Top-K latent IDs to store per sequence per (layer, kind) component
discovery:
  n_seeds: 16 # Number of seed latents to select for circuit discovery
  probe_batch_size: 4 # Max sequences through the grad-enabled instrumented forward pass (lower = less VRAM)
  neg_ctx_eval_max: 16 # Neg sequences used to build the per-seed ablation baseline for eval (0 = zero ablation)
  min_faithfulness: 0.2 # Minimum faithfulness score for a circuit to be accepted
  min_active_count: 1 # Minimum lifetime firing count for a latent to be considered a candidate
  max_neighbors: 32 # Default max co-activation neighbors per node (used as fallback by all methods)
  focal_monosemantic_min_partners: 4 # Min observed coact partners before focal_monosemantic criterion applies (avoids under-sampled latents)

  # Which criteria to use when scoring / shortlisting seed latents.
  # Comment out any entry to ablate that signal source.
  seed_criteria:
    - stratified_random
    # - focal_monosemantic
    # - rare_hub
    # # - stratified_random # uniform random sampling across all components (null baseline)
    # # --- Supervised (output-task-aware) ---
    # # - logit_impact         # sum of stored top-k token probabilities
    # # - logit_specificity    # negative entropy of token predictions (sharp predictors)
    # # - logit_diversity      # positive entropy of token predictions (polyfunctional nodes)
    # # - last_token_activity  # firing frequency at the final prediction-position token
    # # --- Activation statistics ---
    # # - surprise             # mean_seq * rarity boost — borderline (weights by activation strength)
    # - context_coherence # mean activation across top stored contexts
    # - activation_variance # std_seq / mean_seq — discriminative / context-sensitive
    # - activation_skew # max(top_ctx) − mean(top_ctx) — one dominant context
    # - burstiness # active_count / seq_count — tokens fired per sequence
    # # --- Structural / graph ---
    # - connectivity # sum of co-activation weights (weighted hubs)
    # - coactivation_diversity # count of distinct non-zero co-activation partners
    # - cross_layer_reach # distinct layers among co-activation partners
    # - cross_component_breadth # distinct kinds (attn/mlp/resid) among partners
    # - pagerank_centrality # eigenvector centrality on the co-activation graph
    # - coactivation_uniqueness # inverse mean popularity of partners (unique neighbourhood)
    # # --- Data quality / coverage ---
    # - top_ctx_saturation # number of stored top-context sequences
    # - mid_ctx_richness # number of stored mid-band context sequences
    # # - pos_neg_contrast     # borderline (neg-ctx ANN uses residual representations)
    # # --- Unsupervised baselines ---
    # - activation_entropy # binary entropy of per-sequence firing rate (max at p=0.5)
    # # - stratified_random    # uniform random sampling across all components (null baseline)
    # # --- Concept-targeted ---
    # - focal_monosemantic # context_coherence / (n_coact_partners + 1) — high cohesion, low coupling
    # - rare_hub           # rarity × connectivity sum — rare latents well-embedded in the coact graph
    # # --- Empirical (requires a prior discovery run) ---
    # # - circuit_yield        # accumulated faithfulness from circuits this latent seeded before

  # Restrict which seeds are returned after scoring.
  # Both lists act as allowlists — empty means "accept all".
  # layers: integer layer indices (0-based). e.g. [4, 5] — only seeds from layers 4 and 5.
  # kinds:  component kinds — any subset of ["attn", "mlp", "resid"].
  # Constraints are AND-ed: a seed must satisfy both lists (when non-empty).
  seed_filter:
    layers: [] # e.g. [0, 1, 2, 3] — empty = all layers
    kinds: [] # e.g. ["mlp", "resid"] — empty = all kinds

  # Which discovery methods to run. Results from all methods are stored.
  methods:
    # - attn_top_coact_sparse_expansion
    # - mlp_top_coact_sparse_expansion
    # - resid_top_coact_sparse_expansion
    # - attn_mlp_top_coact_sparse_expansion
    # - attn_resid_top_coact_sparse_expansion
    # - mlp_resid_top_coact_sparse_expansion
    # - all_top_coact_sparse_expansion
    # - hard_negative_coact_sparse_expansion
    # - differential_activation
    # - coactivation_statistical
    # - logit_attribution
    # - sfc_attribution_patching
    # - neighborhood_expansion
    # - top_coact_attr
    # - gradient_upstream
    # - layerwise_gradient_upstream
    - counterfactual_gradient # neg_mode: "close" | "random" | "distant" (set below)
    # - cluster_contrast
    # - circuit_tracer_baseline

  # --- Per-method configuration ---

  # Differential Activation: finds nodes by comparing which latents fire
  # differentially between positive (seed active) and negative (seed expected but absent)
  # contexts, then validates edges via feature-to-feature attribution.
  differential_activation:
    n_activator_candidates: 64 # top positive-differential latents to consider
    n_inhibitor_candidates: 32 # top negative-differential latents to consider
    attribution_threshold: 0.01 # min |edge weight| to keep a causal edge
    pruning_threshold: 0.0 # faithfulness drop threshold (0 = disabled)

  gradient_upstream:
    depth: 36 # number of backward hops from the seed (reduced for faster test)
    top_k_per_hop: 8 # top-K upstream latents to select per node per hop (reduced for faster test)
    attribution_threshold: 0.01 # min |score| to include a latent
    min_active_count: 1 # skip latents below this global firing count
    max_ctx_sequences: 16 # total ctx sequences to use per node (summed across microbatches)
    hop_batch_size: 16 # sequences per microbatch in _run_hop (gradient accumulation)
    absent_inhibitor_top_k: 0 # top-K absent inhibitors per hop (0 = disabled)
    absent_inhibitor_threshold: 0.01 # min |raw gradient| at near-zero activation to flag absent inhibitor
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning
    min_faithfulness: 0.2 # minimum faithfulness score for the circuit to be accepted

  # Layerwise variant: sweeps layer-by-layer backwards and attributes against all
  # upstream layers, not just the direct causal predecessors.
  layerwise_gradient_upstream:
    top_k_per_node: 8 # top-K upstream latents per node per pass
    attribution_threshold: 0.01 # min |score| to include a latent
    min_active_count: 1 # skip latents below this global firing count
    max_ctx_sequences: 16 # ctx sequences per node (across microbatches)
    hop_batch_size: 8 # sequences per microbatch in _run_node
    absent_inhibitor_top_k: 0 # top-K absent inhibitors per node (0 = disabled)
    absent_inhibitor_threshold: 0.01
    max_layers_back: 0 # 0 = go back to layer 0; >0 = cap how many layers back
    include_same_layer: true # also include within-layer causal predecessors (attn→mlp etc.)
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning
    min_faithfulness: 0.2 # minimum faithfulness score for circuit acceptance
    profile_first_node: false # set true once to profile; outputs/profile_layerwise_*.json

  hard_negative_coact_sparse_expansion:
    coact_depth: [32, 16] # activator expansion hops
    neg_candidate_limit: 64 # max inhibitor candidates to evaluate via attribution
    attribution_threshold: 0.01 # minimum |score| to keep an inhibitor
    pruning_threshold: 0.0 # faithfulness drop threshold (0 = disabled)

  coactivation_statistical:
    coactivation_threshold: 0.1 # Minimum co-activation weight to include a neighbor as a node (freq_weighted / raw modes)
    pmi_coactivation_threshold: 1.0 # Minimum PMI score to include a neighbor (pmi mode only — "1 nat above chance")
    max_neighbors: 32 # Max neighbors to expand per seed
    pruning_threshold: 0.0 # Faithfulness drop threshold for minimality pruning (0 = disabled)

  logit_attribution:
    logit_threshold: 0.001 # Minimum |activation * gradient| to include a feature as a circuit node
    edge_threshold: 0.00001 # Minimum feature-to-feature attribution score to add an edge
    max_neighbors: 32 # Max co-activation neighbors to consider as edge candidates per node
    pruning_threshold: 0.0 # Faithfulness drop threshold for minimality pruning (0 = disabled)

  # Sparse Feature Circuits (Marks et al. 2024) style attribution patching.
  # Node scores: delta × gradient (clean vs. patch baseline).
  # Edge scores: feature-to-feature Jacobian × delta (via compute_feature_attribution).
  # patch_mode controls the baseline used for delta:
  #   "mean_neg" — average feature activations over neg_ctx sequences (more realistic baseline)
  #   "zero"     — zero ablation, equivalent to the SFC paper's patch=None path
  sfc_attribution_patching:
    node_threshold: 0.1 # |delta × gradient| threshold to include a node
    edge_threshold: 0.01 # minimum edge score to add an edge
    patch_mode: "mean_neg" # "mean_neg" | "zero"
    max_neg: 8 # neg sequences to use for the mean_neg baseline
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)
    ig_steps: 10 # Number of integrated gradient interpolation steps for node attribution

  # Two-hop co-activation neighbourhood expansion (purely statistical, no gradients).
  # Adds all hop-1 co-activation neighbors of the seed, then expands the top n_expand
  # of those into their own top m_neighbors neighbors (hop 2).
  neighborhood_expansion:
    n_expand: 16 # top N hop-1 nodes to further expand into hop-2
    m_neighbors: 16 # top M co-activation neighbors to add per expanded hop-1 node
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)

  # Attn-targeted variable-depth co-activation expansion with full MLP/resid passthrough.
  # coact_depth is a list: length = expansion depth, each value = top-N neighbors at that depth.
  # e.g. [32] = depth-1 only, [32, 32] = two hops, [32, 16, 8] = three hops narrowing each level.
  # Seed must be an attn latent.
  attn_top_coact_sparse_expansion:
    coact_depth: [32, 16] # per-depth top-N attn neighbor limits
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)

  # MLP-targeted variable-depth co-activation expansion with full attn/resid passthrough.
  # Only MLP-kind latents are added by the co-activation hops; every active attn/resid
  # latent (captured via a no-grad probe forward pass) is added as a passthrough node.
  # Seed must be an MLP latent.
  mlp_top_coact_sparse_expansion:
    coact_depth: [32, 16] # per-depth top-N MLP neighbor limits
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)

  # Resid-targeted variable-depth co-activation expansion with full attn/MLP passthrough.
  # Seed must be a resid latent.
  resid_top_coact_sparse_expansion:
    coact_depth: [32, 16] # per-depth top-N resid neighbor limits
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)

  # Attn+MLP-targeted variable-depth co-activation expansion with full resid passthrough.
  # Seed must be attn or mlp. Co-activation hops retain only attn/mlp kinds.
  attn_mlp_top_coact_sparse_expansion:
    coact_depth: [32, 16] # per-depth top-N attn/mlp neighbor limits
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)

  # Attn+resid-targeted variable-depth co-activation expansion with full mlp passthrough.
  # Seed must be attn or resid. Co-activation hops retain only attn/resid kinds.
  attn_resid_top_coact_sparse_expansion:
    coact_depth: [32, 16] # per-depth top-N attn/resid neighbor limits
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)

  # MLP+resid-targeted variable-depth co-activation expansion with full attn passthrough.
  # Seed must be mlp or resid. Co-activation hops retain only mlp/resid kinds.
  mlp_resid_top_coact_sparse_expansion:
    coact_depth: [32, 16] # per-depth top-N mlp/resid neighbor limits
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)

  # All-kinds variable-depth co-activation expansion (attn/mlp/resid), no passthrough stage.
  # Seed can be any kind. Co-activation hops retain all kinds.
  all_top_coact_sparse_expansion:
    coact_depth: [32, 16] # per-depth top-N all-kind neighbor limits
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)

  # Counterfactual Gradient Discovery: gradient attribution on contrast sequences to
  # discover absent activators (upstream latents that would cause the seed to fire if active)
  # and present inhibitors (upstream latents actively suppressing the seed).
  #
  # neg_mode controls the contrast sequence source:
  #   "close"   — hard negatives from neg_ctx (semantically similar, seed absent)
  #   "random"  — uniformly random token sequences from the vocabulary
  #   "distant" — corpus sequences most distant from posctx in SAE latent space at seed layer
  counterfactual_gradient:
    neg_mode: "random" # "close" | "random" | "distant"
    distant_pool_size: 512 # sequences to sample and rank for neg_mode=distant
    top_k_activators: 12 # Top-K absent activators per scope unit
    top_k_inhibitors: 12 # Top-K present inhibitors per scope unit
    top_k_scope: "layer_kind" # "global" = single ranked list; "layer_kind" = top-K per (layer, kind)
    activator_threshold: 0.01 # Min raw gradient magnitude
    inhibitor_threshold: 0.01 # Min |activation × gradient| for inhibitors
    min_active_count: 1 # Min global lifetime firing count
    max_neg_sequences: 16 # Max contrast sequences for the grad-enabled pass
    neg_batch_size: 16 # Sequences per grad-enabled microbatch (lower = less VRAM; set equal to max_neg_sequences to disable batching)
    pruning_threshold: 0 # Faithfulness drop threshold for pruning (0 = disabled)
    min_faithfulness: 0.2 # Min upstream_faithfulness to accept
    node_presence_eval: true # Run posctx node presence/absence eval after circuit acceptance

  # SAE-adapted Circuit Tracing Baseline: builds a prompt-local direct-effects adjacency
  # matrix over all active SAE latents (attn/mlp/resid), propagates influence from target-token
  # logit nodes via power iteration (Neumann series), and globally prunes by influence/edge
  # thresholds. Aligned with Anthropic's Attribution Graphs method adapted for multi-kind SAEs.
  # Logit targets selected by cumulative softmax probability (desired_logit_prob).
  # Features ranked by logit-influence before backward passes (max_feature_nodes cap).
  # Node/edge thresholds are fraction-based (scale-invariant), not absolute.
  # VRAM strategy: probe_batch_size=1, single retained graph per sequence.
  circuit_tracer_baseline:
    probe_batch_size: 1 # sequences per grad-enabled forward (low for VRAM safety)
    max_sequences: 8 # pos_ctx sequences used to build the adjacency matrix
    target_chunk_size: 8 # deprecated — no longer used; kept for YAML compatibility
    logit_top_k: 5 # hard cap on logit target nodes (actual count may be lower per desired_logit_prob)
    desired_logit_prob: 0.95 # cumulative softmax probability to cover when selecting logit targets
    influence_max_iter: 1000 # safety cap on iterations; raises RuntimeError on non-convergence (matches original circuit-tracer)
    node_threshold: 0.8 # fraction of total node-influence to retain (0-1); keeps smallest set covering 80% of influence
    edge_threshold: 0.98 # fraction of total edge-influence to retain (0-1); keeps smallest set covering 98% of edge influence
    min_faithfulness: 0.2 # upstream-faithfulness acceptance gate
    pruning_threshold: 0.0 # minimality pruning drop threshold (0 = disabled)
    min_active_count: 1 # skip latents below this global lifetime firing count
    max_feature_nodes: 2048 # cap on feature nodes after logit-influence ranking (0 = unlimited)
    stop_error_grad: false # true = gradient flows only through SAE features (not error term)
    include_error_nodes: true # add one error sentinel per (layer, kind) for reconstruction-error attribution
    online_ranking_interval: 4 # re-rank remaining features every N cycles (matches original update_interval=4); 0 = one-shot ordering
    feature_batch_size: 32 # features processed per cycle (matches original batch_size=32); 4×32=128 features per ranking update
    include_token_nodes: false # add T token sentinel nodes for per-position input embedding attribution (default off — confirm gradient routing before enabling)

  # Cluster Contrast Discovery: seed-free method that clusters all neg_ctx sequences by
  # embedding space, then runs KL-divergence gradient attribution to discover which upstream
  # SAE latents explain each cluster's characteristic output distribution.
  # Counterfactual sequences are drawn from the centers of other clusters; the loss is the
  # KL divergence between the counterfactual sequences' current output and the target cluster's
  # mean logit distribution.  Set enabled: true to run this during the pipeline.
  cluster_contrast:
    n_clusters: 3000 # k-means k (number of embedding-space clusters)
    top_clusters: 8 # top clusters by size to run discovery on
    kmeans_iters: 1024 # k-means iterations
    kmeans_seed: 42 # random seed for centroid initialisation
    num_pos_seqs: 64 # positive sequences per cluster (top-N closest to centroid, in-cluster)
    num_neg_seqs: 64 # negative sequences per cluster (top-N closest to centroid, out-of-cluster)
    batch_size: 1 # sequences per forward pass (pos and neg)
    eval_position: "last" # token position for KL loss: "last" = final token | "all" = mean over positions
    top_k_activators: 12 # top-K absent activators per scope unit
    top_k_inhibitors: 12 # top-K present inhibitors per scope unit
    top_k_scope: "layer_kind" # "global" = single ranked list | "layer_kind" = top-K per (layer, kind)
    activator_threshold: 0.01 # min raw gradient magnitude to include an activator
    inhibitor_threshold: 0.01 # min |activation × gradient| to include an inhibitor
    min_active_count: 1 # min global lifetime firing count for candidate latents
    pruning_threshold: 0.0 # faithfulness drop threshold for minimality pruning (0 = disabled)
    run_eval: true # run KL faithfulness + specificity eval after discovery

  # Legacy method — cross-layer attribution now uses identity passthrough (x - x.detach())
  top_coact_attr:
    attribution_threshold: 0.01
    max_neighbors: 32
    max_hops: 2
    pruning_threshold: 0.01

persist:
  save_workers: 1 # max parallel torch.save threads (1 = sequential)
  search_cache_enabled: false
  build_search_cache_after_pipeline: false # false = defer to scripts/build_search_cache.sh
  atomic_saves: true
  search_cache_n_sequences: 8 # reduce from 16
  search_cache_component_chunk: 4 # components processed at a time

# Post-circuit analysis: runs after each accepted circuit is stored.
# Each method produces metadata keys merged into circuit.metadata["post_analysis"]
# and surfaced in outputs/circuits/summary.json.
analysis:
  methods:
    - coactivation_overlap # % circuit nodes in seed's top-K coactivations
    - layer_distribution # layer_mean, layer_std, layer_min, layer_max
    - edge_weight_gini # Gini coefficient of edge weights (0=uniform, 1=concentrated)
    - node_activity # activity_mean, activity_median (lifetime firing counts)
    - node_rarity # rarity_pct (% nodes below global p10 active_count)
    - top_token_consistency # top_token_consistency_pct (% nodes sharing seed's top-1 token)
    - internode_coact_density # internode_coact_density_pct (% mutual coact pairs)
